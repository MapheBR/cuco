services:
  cuco:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      SESSION_SECRET: "${SESSION_SECRET:?defina SESSION_SECRET no ambiente}"
      SECURE_COOKIES: "1"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
