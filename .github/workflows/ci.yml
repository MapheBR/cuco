name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Checar sintaxe
        run: npm run check
      - name: Linter
        run: npm run lint
      - name: Testes de integração
        run: npm test
